name: Repository baseline

on:
  workflow_call:
    inputs:
      kit_ref:
        description: Full reviewed commit SHA of oney-erge/engineering-kit
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable kit revision
        env:
          KIT_REF: ${{ inputs.kit_ref }}
        run: python3 -c 'import os, re, sys; sys.exit(0 if re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["KIT_REF"]) else "kit_ref must be a full commit SHA")'
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - name: Check out reviewed kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oney-erge/engineering-kit
          ref: ${{ inputs.kit_ref }}
          path: engineering-kit
          persist-credentials: false
      - name: Validate declarations without executing checks
        id: validate
        continue-on-error: true
        run: python3 engineering-kit/repoctl.py validate target > repository-contract.json
      - name: Save contract validation output
        if: always() && steps.validate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-contract-validation
          path: repository-contract.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve validation failure
        if: always() && steps.validate.outcome == 'failure'
        run: exit 1
